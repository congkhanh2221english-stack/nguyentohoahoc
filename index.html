function C(n,r){if(r<0||r>n)return 0;r=Math.min(r,n-r);let v=1;for(let i=1;i<=r;i++)v=v*(n-r+i)/i;return Math.round(v)}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function shuffle(a,seed){a=[...a];let x=seed||1;for(let i=a.length-1;i>0;i--){x=(Math.imul(x,1664525)+1013904223)>>>0;let j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

function qMake(mod,i,adv,topic,text,correct,distractors,expl,rule,trap,calc=true){
  const id=`GEN-${mod}-${adv?'A':'B'}-${String(i+1).padStart(2,'0')}`;
  let vals=[String(correct),...distractors.map(String)].filter((x,idx,a)=>a.indexOf(x)===idx);
  let f=1;while(vals.length<4)vals.push('Phương án '+f++);
  vals=shuffle(vals.slice(0,4),hash(id));
  return {id,module:mod,topic,level:adv?'Nâng cao':'Cơ bản',type:'mc',text,opts:vals,a:vals.indexOf(String(correct)),expl,rule,trap,calc,source:'Biến thể cùng dạng từ LIVE 2 – Nguyên tố hóa học'};
}
function m1gen(i,adv){
 const Z=5+(i*3)%31,N=Z+(i%5)-1,A=Z+N,k=i%5;
 if(!adv){
  if(k===0)return qMake('m1',i,0,'Số neutron',`Nguyên tử X có Z = ${Z}, A = ${A}. Số neutron của X là?`,N,[N+1,Math.max(0,N-1),A],`N=A−Z=${A}−${Z}=${N}.`,'N = A − Z.','Nhầm A là số neutron.');
  if(k===1)return qMake('m1',i,0,'Số khối',`Nguyên tử X có ${Z} proton và ${N} neutron. Số khối A bằng?`,A,[Z,N,A+1],`Số khối đếm proton và neutron trong hạt nhân: A=${Z}+${N}=${A}.`,'A = Z + N.','Cộng cả electron vào số khối.');
  if(k===2)return qMake('m1',i,0,'Điện tích hạt nhân',`Nguyên tử trung hòa X có ${Z} electron. Điện tích hạt nhân của X là?`,`+${Z}`,[`-${Z}`,`+${A}`,`${Z}`],`Trung hòa nên p=e=${Z}; hạt nhân có ${Z} proton nên điện tích hạt nhân là +${Z}.`,'Z = p = e; qₕₙ = +Z.','Quên dấu dương hoặc dùng A.');
  if(k===3)return qMake('m1',i,0,'Tìm Z',`Nguyên tử X có A=${A} và N=${N}. Số hiệu nguyên tử Z là?`,Z,[N,A,Z+1],`Z=A−N=${A}−${N}=${Z}.`,'Z = A − N.','Lấy Z=A+N.');
  return qMake('m1',i,0,'Kí hiệu nguyên tử',`Một nguyên tử có ${Z} proton và ${N} neutron. Cặp (A; Z) đúng là?`,`(${A}; ${Z})`,[`(${Z}; ${A})`,`(${N}; ${Z})`,`(${A}; ${N})`],`Z=p=${Z}, A=p+n=${A}. Trong kí hiệu ᴬZX, A ở trên và Z ở dưới.`,'Kí hiệu nguyên tử: ᴬZX.','Đảo vị trí A và Z.');
 }
 if(k===0){let total=2*Z+N,diff=2*Z-N;return qMake('m1',i,1,'Hệ tổng – hiệu',`Nguyên tử trung hòa X có tổng p+n+e=${total}; số hạt mang điện nhiều hơn hạt không mang điện ${diff}. Z bằng?`,Z,[Z-1,Z+1,N],`Đặt p=e=Z: 2Z+N=${total}; 2Z−N=${diff}. Cộng hai phương trình: 4Z=${total+diff} ⇒ Z=${Z}.`,'p=e=Z; hạt mang điện=p+e=2Z.','Chỉ tính proton là hạt mang điện.');}
 if(k===1){let total=2*Z+N;return qMake('m1',i,1,'Tổng số hạt',`X có tổng p+n+e=${total}, biết N=${N}. Số khối A là?`,A,[total-Z,total-N,A+1],`2Z+N=${total} ⇒ Z=(${total}−${N})/2=${Z}; A=Z+N=${A}.`,'T = 2Z + N; A = Z + N.','Dùng T làm số khối.');}
 if(k===2){let ratio=N/Z;return qMake('m1',i,1,'Suy luận A–Z',`Một nguyên tử có Z=${Z}, số neutron nhiều hơn số proton ${N-Z} hạt. Số khối là?`,A,[2*Z,N,A-1],`N=${Z}+${N-Z}=${N}; A=Z+N=${A}.`,'A=Z+N.','Quên chuyển mô tả “nhiều hơn” thành N.');}
 if(k===3){return qMake('m1',i,1,'Kiểm tra kí hiệu',`Kí hiệu ᴬZX có A=${A}, Z=${Z}. Tổng số hạt cơ bản p+n+e bằng?`,2*Z+N,[A,2*A-Z,A+Z+1],`p=e=Z=${Z}, n=A−Z=${N}. Tổng=2Z+N=${2*Z+N}.`,'T = p+n+e = 2Z+N = A+Z.','Nhầm tổng hạt với A.');}
 let charged=2*Z;return qMake('m1',i,1,'Hạt mang điện',`Nguyên tử X có số khối A=${A}, số neutron N=${N}. Tổng số hạt mang điện là?`,charged,[Z,N,A],`Z=A−N=${Z}; proton và electron đều mang điện nên p+e=2Z=${charged}.`,'Hạt mang điện = p+e = 2Z.','Chỉ đếm electron hoặc proton.');
}
function m2gen(i,adv){
 const Z=6+(i*2)%20,A1=2*Z+(i%3),A2=A1+1+(i%2),N1=A1-Z,N2=A2-Z,k=i%5;
 if(!adv){
  if(k===0)return qMake('m2',i,0,'Khái niệm nguyên tố','Hai nguyên tử thuộc cùng một nguyên tố hóa học khi chúng có cùng đại lượng nào?','Số proton',['Số neutron','Số khối','Tổng số hạt'],'Danh tính nguyên tố do điện tích hạt nhân Z, tức số proton, quyết định.','Cùng nguyên tố ⇔ cùng Z (cùng p).','Cùng A không đồng nghĩa cùng nguyên tố.',false);
  if(k===1)return qMake('m2',i,0,'Khái niệm đồng vị','Hai đồng vị của cùng một nguyên tố có đặc điểm nào?','Cùng Z, khác N',['Khác Z, cùng N','Cùng A, khác Z','Cùng Z, cùng N'],'Đồng vị vẫn là cùng nguyên tố nên Z không đổi; neutron khác nên A khác.','Đồng vị: cùng Z, khác N.','Nhầm đồng vị với cùng số khối.',false);
  if(k===2)return qMake('m2',i,0,'Nhận diện đồng vị',`Nguyên tử X có (Z=${Z}, A=${A1}) và Y có (Z=${Z}, A=${A2}). Quan hệ đúng là?`,'X và Y là đồng vị',['X và Y là hai nguyên tố khác nhau','X và Y có cùng số neutron','X và Y có cùng số khối'],`Hai nguyên tử cùng Z=${Z} nhưng A khác nhau, nên là đồng vị.`,'Cùng Z nhưng khác A ⇒ đồng vị.','Nhìn A khác rồi kết luận khác nguyên tố.',false);
  if(k===3)return qMake('m2',i,0,'Cùng số neutron',`X có Z=${Z}, A=${A1}. Số neutron của X là?`,N1,[Z,A1,N1+1],`N=A−Z=${A1}−${Z}=${N1}.`,'N=A−Z.','Dùng Z thay N.');
  return qMake('m2',i,0,'Tính chất đồng vị','Các đồng vị của cùng một nguyên tố có số electron bằng nhau khi nào?','Khi xét các nguyên tử trung hòa',['Luôn luôn kể cả ion khác điện tích','Không bao giờ','Chỉ khi số khối bằng nhau'],'Nguyên tử trung hòa có e=Z; các đồng vị cùng Z nên có cùng e.','Nguyên tử trung hòa: e=Z.','Quên điều kiện trung hòa.',false);
 }
 if(k===0){let z2=Z+1;return qMake('m2',i,1,'Phân biệt cùng A',`X có (Z=${Z}, A=${A1}) và Y có (Z=${z2}, A=${A1}). Nhận định đúng là?`,'Cùng số khối nhưng khác nguyên tố',['Là đồng vị','Cùng số proton','Cùng số neutron'],`A bằng nhau nhưng Z khác nhau, nên chúng không phải cùng nguyên tố.`,'Nguyên tố được xác định bởi Z, không phải A.','Thấy A giống nhau rồi chọn đồng vị.',false);}
 if(k===1){let z2=Z+2,a2=z2+N1;return qMake('m2',i,1,'Cùng số neutron',`X: Z=${Z}, A=${A1}; Y: Z=${z2}, A=${a2}. Hai nguyên tử có điểm chung nào?`,'Cùng số neutron',['Cùng nguyên tố','Cùng số proton','Là đồng vị'],`N_X=${A1}−${Z}=${N1}; N_Y=${a2}−${z2}=${N1}.`,'N=A−Z.','Cùng neutron không có nghĩa là đồng vị.');}
 if(k===2)return qMake('m2',i,1,'Đếm phát biểu',`Cho X(Z=${Z},A=${A1}) và Y(Z=${Z},A=${A2}). Có bao nhiêu phát biểu đúng: (1) cùng nguyên tố; (2) cùng số proton; (3) cùng số neutron; (4) là đồng vị?`,'3',['1','2','4'],`(1), (2), (4) đúng; (3) sai vì A khác trong khi Z giống nhau nên N khác.`,'Đồng vị: cùng Z, khác N/A.','Đếm “cùng nguyên tố” và “đồng vị” như mâu thuẫn nhau.',false);
 if(k===3){let z2=Z+1,a2=z2+N1;return qMake('m2',i,1,'So sánh kí hiệu',`X có ${Z} proton, ${N1} neutron; Y có ${z2} proton, ${N1} neutron. Phát biểu đúng?`,'X và Y khác nguyên tố nhưng cùng số neutron',['X và Y là đồng vị','X và Y cùng số khối','X và Y cùng điện tích hạt nhân'],`Z khác nên khác nguyên tố; N được cho bằng nhau.`,'Cùng nguyên tố ⇔ cùng Z.','Cùng N bị nhầm thành đồng vị.',false);}
 return qMake('m2',i,1,'Bản chất nguyên tố','Nếu một nguyên tử trung hòa nhận thêm 1 electron thành anion, nó có trở thành nguyên tố khác không?','Không, vì số proton không đổi',['Có, vì số electron đổi','Có, vì điện tích đổi','Chỉ khi A không đổi'],`Nguyên tố được xác định bởi số proton Z. Nhận electron chỉ đổi điện tích, không đổi hạt nhân.`,'Danh tính nguyên tố do Z quyết định.','Dùng số electron để định danh nguyên tố trong mọi trường hợp.',false);
}
function m3gen(i,adv){
 const h=2+(i%3),o=2+((i+1)%3),x=2+(i%4),y=2+((i+2)%4),k=i%5;
 if(!adv){
  if(k===0){let ans=h*o;return qMake('m3',i,0,'Phân tử XY',`Nguyên tố X có ${h} đồng vị, Y có ${o} đồng vị. Có tối đa bao nhiêu loại phân tử XY?`,ans,[ans-1,ans+2,h+o],`Chọn 1 đồng vị X có ${h} cách và 1 đồng vị Y có ${o} cách ⇒ ${h}×${o}=${ans}.`,'XY: số loại = m·n.','Cộng số cách thay vì nhân.');}
  if(k===1){let ans=C(h+1,2);return qMake('m3',i,0,'Phân tử X₂',`Nguyên tố X có ${h} đồng vị. Có bao nhiêu loại phân tử X₂ khác nhau về thành phần đồng vị?`,ans,[h*h,Math.max(1,ans-1),ans+h],`Hai vị trí X giống nhau nên cặp (a,b) và (b,a) là một loại. Số tổ hợp lặp là C(${h}+1,2)=${ans}.`,'X₂: C(m+1,2).','Dùng m² và đếm hoán vị hai nguyên tử giống nhau.');}
  if(k===2){let ans=C(h+1,2);return qMake('m3',i,0,'Phân tử H₂O',`Hydrogen có ${h} đồng vị, oxygen chỉ xét 1 đồng vị. Có bao nhiêu loại H₂O?`,ans,[h*h,h,ans+1],`Hai H tương đương nên số cặp đồng vị H là C(${h}+1,2)=${ans}; O có 1 cách.`,'H₂O với 1 đồng vị O: C(mH+1,2).','Đếm H₁H₂ và H₂H₁ thành hai loại.');}
  if(k===3){let ans=x*y;return qMake('m3',i,0,'Phân tử dị hạt',`Có ${x} đồng vị của A và ${y} đồng vị của B. Số phân tử AB khác nhau là?`,ans,[x+y,ans+x,Math.abs(x-y)],`A và B là hai vị trí khác loại: nhân số cách chọn.`,'AB: mA·mB.','Dùng tổ hợp lặp cho hai nguyên tố khác nhau.');}
  let masses=[16,17,18], mmin=12+masses[0]*2;return qMake('m3',i,0,'Phân tử khối cực trị',`Carbon chỉ xét ¹²C, oxygen có ¹⁶O, ¹⁷O, ¹⁸O. Phân tử khối nhỏ nhất của CO₂ là?`,mmin,[12+16+17,12+18*2,12+17*2],`Muốn nhỏ nhất, chọn đồng vị nhẹ nhất cho cả hai O: 12+16+16=${mmin}.`,'Cực tiểu: chọn các số khối nhỏ nhất.','Chọn hai đồng vị O khác nhau dù đề hỏi nhỏ nhất.');
 }

function moduleIdForSource(q){
 let t=q.text.toLowerCase();
 if(t.includes('phổ khối')||t.includes('khối lượng ms')||t.includes('% theo khối lượng')||t.includes('số mol của đồng vị')||t.includes('avogadro'))return 'm6';
 if(t.includes('nguyên tử khối trung bình')||t.includes('thành phần phần trăm')||t.includes('hàm lượng %')||t.includes('số khối của đồng vị'))return (t.includes('phần trăm')||t.includes('số khối của đồng vị')||t.includes('nếu có'))?'m5':'m4';
 if(t.includes('bao nhiêu loại phân tử')||t.includes('số loại phân tử')||t.includes('phân tử khối nhỏ nhất')||t.includes('phân tử khối lớn nhất')||t.includes('số phân tử hcl')||t.includes('hợp chất no2'))return 'm3';
 if(t.includes('đồng vị')||t.includes('cùng một nguyên tố')||t.includes('cùng số neutron')||t.includes('cùng số khối'))return 'm2';
 return 'm1';
}
function sourceCalc(q){
 let m=moduleIdForSource(q),t=q.text.toLowerCase();
 if(['m3','m4','m5','m6'].includes(m))return true;
 return /tổng|số neutron|số khối|z=|proton|electron|điện tích/.test(t)&&!/(phát biểu|định nghĩa|nhận định|thông tin nào|nguyên tố hóa học là)/.test(t);
}
function sourceToQ(x){
 let mid=moduleIdForSource(x),m=modules.find(v=>v.id===mid);
 return {...x,module:mid,level:x.set==='Ôn tập gốc'?'Ôn tập':'Tự luyện',source:'Câu gốc từ file LIVE 2 – Nguyên tố hóa học',rule:m.formula,expl:`Quay về quy tắc lõi của dạng “${m.title}”: ${m.memory}`,trap:m.trap,calc:sourceCalc(x)};
}
function reverseThinking(q){
 const m=q.module;
 if(m==='m1')return {goal:'Tìm Z, A, p, n, e hoặc kí hiệu nguyên tử.',chain:'Đại lượng cần tìm ← Z/A/N trực tiếp ← p=e=Z và A=Z+N ← dữ kiện đề',steps:['Xác định đề hỏi Z, A hay N.','Nếu trung hòa, thay p và e bằng Z.','Chỉ sau đó mới lập tổng/hiệu và tính.'],trap:'Phân biệt A (p+n) với tổng p+n+e.'};
 if(m==='m3')return {goal:'Đếm số loại phân tử khác nhau về thành phần đồng vị.',chain:'Số loại phân tử ← số cách chọn cho từng vị trí ← phân biệt vị trí giống/khác nhau ← số đồng vị mỗi nguyên tố',steps:['Đếm số đồng vị của từng nguyên tố.','Vị trí khác nguyên tố: nhân số cách.','Các vị trí cùng nguyên tố: dùng tổ hợp lặp để tránh đếm trùng.'],trap:'H₁H₂ và H₂H₁ không phải hai loại khác nhau nếu hai vị trí tương đương.'};
 if(m==='m4')return {goal:'Tính nguyên tử khối trung bình Ā.',chain:'Ā ← tổng (số khối × trọng số) ← %/tỉ lệ từng đồng vị ← dữ kiện đề',steps:['Chuẩn hóa trọng số về % hoặc số phần.','Nhân từng Aᵢ với trọng số tương ứng.','Chia tổng trọng số và kiểm Ā nằm giữa các Aᵢ.'],trap:'Không dùng trung bình cộng nếu tỉ lệ đồng vị khác nhau.'};
 if(m==='m5')return {goal:'Tìm đại lượng còn thiếu trong bài đồng vị.',chain:'Ẩn cần tìm ← phương trình Ā ← điều kiện Σx=100% ← dữ kiện số khối/tỉ lệ',steps:['Đặt đúng ẩn: % hay số khối.','Viết phần còn lại bằng 100−x nếu có 2 đồng vị.','Giải rồi kiểm 0–100% và Ā nằm giữa các số khối.'],trap:'Nếu kết quả % âm hoặc >100%, phương trình/ẩn đã đặt sai.'};
 if(m==='m6')return {goal:'Đi từ dữ liệu phổ/mẫu chất đến Ā, % khối lượng hoặc lượng đồng vị.',chain:'Đáp án ← lượng đồng vị/Ā ← abundance từ peak hoặc % đã cho ← m/z, mol, công thức chất',steps:['Đọc m/z và tỉ lệ peak đúng trục.','Chuyển % thành phần số trước khi nhân.','Nếu ở phân tử, nhân hệ số nguyên tử của nguyên tố trong công thức.'],trap:'% số nguyên tử không tự động bằng % khối lượng trong hợp chất.'};
 return {goal:'Nhận diện quan hệ giữa các nguyên tử.',chain:'Kết luận ← so Z trước ← sau đó mới so A/N',steps:['Tính/đọc Z.','Cùng Z mới xét đồng vị.','Sau đó so N hoặc A.'],trap:'Không dùng A để định danh nguyên tố.'};
}
function analysisHTML(q){
 if(!q.calc)return '';
 const r=reverseThinking(q);
 return `<details class="analysisBox" open><summary>🧭 Phân tích đề · Tư duy ngược</summary><div class="analysisBody"><div class="analysisGrid"><div class="analysisCard"><h4>1. Đọc đề theo chiều thuận</h4><p><b>Đích cần tìm:</b> ${esc(r.goal)}</p><ol class="analysisSteps">${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div><div class="analysisCard reverse"><h4>2. Đi ngược từ đáp án</h4><p>Hỏi: <b>“Muốn có kết quả cuối, ngay trước đó mình phải biết gì?”</b></p><div class="analysisArrow">${esc(r.chain)}</div><p>Khi chuỗi ngược chạm đúng dữ kiện đề cho, quay lại giải theo chiều xuôi.</p></div></div><div class="analysisHint"><b>⚠ Bẫy cần kiểm:</b> ${esc(r.trap)}</div></div></details>`;
}
function spectrumHTML(s){
 if(!s)return '';let max=Math.max(...s.peaks.map(p=>p[1]));
 return `<div class="spectrum"><h4>📈 ${esc(s.title)}</h4><div class="sBars">${s.peaks.map(p=>`<div class="sBarWrap"><div class="sBar" style="height:${Math.max(3,p[1]/max*100)}%"><b>${p[1]}%</b><span class="sMass">${p[0]}</span></div></div>`).join('')}</div><div class="sAxis">m/z → &nbsp; (cường độ tương đối ở trên peak)</div></div>`;
}
function renderQuiz(){let q=quiz.list[quiz.idx];if(!q){$('#v-quiz').innerHTML='<div class="card">Không có câu hỏi.</div>';return}
 $('#v-quiz').innerHTML=`<div class="pagehead"><div><button class="btn secondary" onclick="nav('practice')">← Phòng luyện</button><h2>${esc(quiz.title)}</h2></div><span class="tag blue">${quiz.idx+1}/${quiz.list.length}</span></div><div class="qwrap card"><div class="qmeta"><span class="tag ${q.level==='Nâng cao'?'purple':q.level==='Cơ bản'?'green':'blue'}">${esc(q.level)}</span><span class="tag amber">${esc(q.source)}</span></div><div class="qtext">${esc(q.text)}</div>${spectrumHTML(q.spectrum)}${analysisHTML(q)}${q.type==='short'?`<input id="shortAns" style="width:100%;height:52px;border:1px solid var(--line);border-radius:12px;padding:0 13px" placeholder="Nhập đáp án...">`:q.opts.map((o,i)=>`<button class="opt ${quiz.sel===i?'sel':''} ${quiz.checked&&i===q.a?'ok':''} ${quiz.checked&&quiz.sel===i&&i!==q.a?'bad':''}" onclick="choose(${i})" ${quiz.checked?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}<div id="fb">${quiz.checked?feedbackHTML(q):''}</div><div class="actionsRow"><button class="btn secondary" onclick="prevQ()" ${quiz.idx===0?'disabled':''}>← Trước</button><div><button class="btn primary" onclick="checkQ()" ${quiz.checked?'disabled':''}>Kiểm tra (Enter)</button> <button class="btn success" onclick="nextQ()" ${!quiz.checked?'disabled':''}>Tiếp →</button></div></div></div>`;
}
function choose(i){if(!quiz.checked){quiz.sel=i;renderQuiz()}}
function norm(s){return String(s??'').trim().toLowerCase().replace(/\s+/g,'').replace(',','.')}
function currentAnswer(q){return q.type==='short'?($('#shortAns')?.value||''):quiz.sel}
function isCorrect(q){if(q.type==='short')return norm($('#shortAns')?.value)===norm(q.answer);return quiz.sel===q.a}
function answerText(q,sel){if(q.type==='short')return String(sel||'Bỏ trống');return Number.isInteger(sel)&&sel>=0?q.opts[sel]:'Bỏ trống'}
function checkQ(){
 let q=quiz.list[quiz.idx];if(q.type==='mc'&&quiz.sel===null){toast('Chọn một đáp án trước.');return}
 let selected=currentAnswer(q),ok=isCorrect(q);quiz.checked=true;st.attempted++;
 if(ok){st.correct++;st.xp+=10}else{st.xp+=2;st.wrong.unshift({id:Date.now()+Math.random(),qid:q.id,text:q.text,module:q.module,selected,when:new Date().toLocaleString()});if(st.wrong.length>180)st.wrong.length=180}
 if(q.module&&q.module!=='source')st.done[q.module]=Math.min(100,(st.done[q.module]||0)+1);
 save();updateTop();renderQuiz();if(!ok)setTimeout(()=>openRemedy(q,selected),250);
}
function feedbackHTML(q){
 let ok=isCorrect(q),sel=currentAnswer(q),ans=q.type==='short'?q.answer:q.opts[q.a],r=q.calc?reverseThinking(q):null;
 return `<div class="feedback ${ok?'explain':'warning'}"><b>${ok?'✓ Chính xác':'✗ Chưa đúng'}</b>${!ok?`<div class="answerCompare"><div class="answerPill bad"><b>Em đã trả lời</b><br>${esc(answerText(q,sel))}</div><div class="answerPill good"><b>Đáp án đúng</b><br>${esc(ans)}</div></div>`:`<p><b>Đáp án:</b> ${esc(ans)}</p>`}<p><b>Vì sao?</b> ${esc(q.expl||'Đưa câu hỏi về quy tắc cốt lõi của dạng rồi đối chiếu từng dữ kiện.')}</p><p><b>Công thức / quy tắc:</b> ${esc(q.rule||modules.find(m=>m.id===q.module)?.formula||'')}</p>${!ok?`<p><b>Bẫy của câu:</b> ${esc(q.trap||modules.find(m=>m.id===q.module)?.trap||'')}</p>`:''}${r?`<div class="analysisHint"><b>↩ Kiểm lại bằng tư duy ngược:</b> ${esc(r.chain)}</div>`:''}</div>`;
}
function nextQ(){if(!quiz.checked)return;if(quiz.idx>=quiz.list.length-1){toast('Hoàn thành lượt luyện!');nav('report');return}quiz.idx++;quiz.sel=null;quiz.checked=false;renderQuiz()}
function prevQ(){if(quiz.idx>0){quiz.idx--;quiz.sel=null;quiz.checked=false;renderQuiz()}}
function remedySteps(q){
 const m=q.module;
 if(m==='m1')return [
 ['Nhận diện đích','Đề hỏi đại lượng nào trước tiên?',['Z/A/N/p/e hoặc kí hiệu','Một nguyên tố khác','Không cần xác định'],0],
 ['Quy tắc nền','Với nguyên tử trung hòa, quan hệ đúng là?',['p=e=Z','p=n=A','e=n'],0],
 ['Số khối','A được tính bằng?',['Z+N','Z+e+N','Z−N'],0],
 ['Tự kiểm','Nếu tìm được N>A thì điều gì xảy ra?',['Cách làm chắc chắn sai','Hoàn toàn bình thường','A phải âm'],0],
 ['Chốt lỗi','Cách giảm sai tốt nhất?',['Viết quan hệ trước rồi thay số','Thử từng đáp án','Bỏ qua kí hiệu'],0]];
 if(m==='m2')return [
 ['Danh tính nguyên tố','Đại lượng quyết định nguyên tố là?',['Z/số proton','A','N'],0],
 ['Đồng vị','Đồng vị phải có?',['Cùng Z, khác N','Khác Z, cùng A','Cùng N'],0],
 ['Cùng A','Hai nguyên tử cùng A nhưng khác Z có là đồng vị không?',['Không','Có','Luôn cùng nguyên tố'],0],
 ['Cùng N','Cùng số neutron có đủ để kết luận đồng vị?',['Không','Có','Chỉ khi A bằng nhau'],0],
 ['Chốt lỗi','Khi so hai kí hiệu, nên so gì trước?',['Z','A','Khối lượng trung bình'],0]];
 if(m==='m3')return [
 ['Xác định cấu trúc','Trong XY₂, hai vị trí Y có phân biệt thứ tự không?',['Không','Có','Tùy số khối'],0],
 ['AB','Với A và B khác nguyên tố, số cách chọn là?',['Nhân số đồng vị','Cộng số đồng vị','Bình phương tổng'],0],
 ['X₂','Với m đồng vị X, số loại X₂ là?',['C(m+1,2)','m²','2m'],0],
 ['H₂O','Hai H được đếm theo?',['Tổ hợp lặp','Hoán vị','Chỉ đồng vị nhẹ nhất'],0],
 ['Chốt lỗi','Bước quan trọng nhất?',['Xác định vị trí giống nhau trước khi đếm','Nhân mọi con số','Chọn đáp án lớn nhất'],0]];
 if(m==='m4'||m==='m5')return [
 ['Bản chất Ā','Ā là loại trung bình nào?',['Trung bình có trọng số','Trung bình cộng luôn','Trung vị'],0],
 ['Phần trăm','Tổng % các đồng vị trong mẫu là?',['100%','50%','Không cố định'],0],
 ['Kiểm khoảng','Ā phải?',['Nằm giữa các số khối','Lớn hơn tất cả','Nhỏ hơn tất cả'],0],
 ['Giải ngược','Nếu thiếu %, cần thêm điều kiện nào?',['Tổng % =100','A=Z+N','p=e'],0],
 ['Chốt lỗi','Nên làm gì trước khi thay số?',['Viết phương trình trọng số','Đoán tỉ lệ','Làm tròn ngay'],0]];
 return [
 ['Đọc phổ','Với z=+1, m/z gần bằng?',['Số khối A','Z','N'],0],
 ['Cường độ','Độ cao peak phản ánh?',['Độ phổ biến tương đối','Số proton','Điện tích hạt nhân'],0],
 ['Mẫu chất','n đồng vị được tính bằng?',['Tỉ lệ × n nguyên tố','Tỉ lệ + n nguyên tố','M nguyên tố'],0],
 ['Hợp chất','% số nguyên tử có bằng % khối lượng luôn không?',['Không','Có','Chỉ với mọi halogen'],0],
 ['Chốt lỗi','Khi có phân tử X₂, lượng nguyên tử X phải?',['Nhân hệ số 2','Chia 2','Giữ nguyên'],0]];
}
function openRemedy(q,selected){
 let steps=remedySteps(q),n=0;
 function show(){let s=steps[n];openModal(`<span class="tag purple">Chuỗi tìm lỗ hổng ${n+1}/5</span><h3>${s[0]}</h3><p>${s[1]}</p>${s[2].map((x,i)=>`<button class="opt" onclick="remedyPick(${i})"><span class="letter">${'ABC'[i]}</span>${esc(x)}</button>`).join('')}`)}
 window._remedy=(i)=>{if(i!==steps[n][3]){toast('Chưa đúng. Quay lại quy tắc cốt lõi.');return}n++;if(n>=steps.length){closeModal();toast('Đã hoàn thành chuỗi chữa lỗi.');return}show()};show();
}
window.remedyPick=i=>window._remedy(i);
function renderSource(){$('#v-source').innerHTML=`<div class="pagehead"><div><h2>Bài gốc từ file LIVE 2</h2><p>Giữ mạch bài của tài liệu: 30 câu hỏi ôn tập và 50 câu bài tập tự luyện. Các câu có phổ khối lượng được dựng lại bằng biểu đồ trực quan trong app.</p></div></div><div class="grid g2"><div class="card"><span class="tag blue">30 câu</span><h3>Câu hỏi ôn tập</h3><p class="muted">Z – A – kí hiệu nguyên tử, nguyên tố hóa học, đồng vị, số loại phân tử, Ā.</p><button class="btn primary" onclick="startSource('Ôn tập gốc')">Làm 30 câu</button></div><div class="card"><span class="tag purple">50 câu</span><h3>Bài tập tự luyện</h3><p class="muted">Từ nhận biết đến phổ MS, tìm %/số khối đồng vị và bài tổng hợp.</p><button class="btn purpleBtn" onclick="startSource('Tự luyện gốc')">Làm 50 câu</button></div></div>`}
function startSource(set){quiz={list:SOURCE.filter(x=>x.set===set).map(sourceToQ),idx:0,sel:null,checked:false,title:set};navQuiz()}
function renderWrong(){let items=st.wrong.length?st.wrong.map((w,i)=>`<div class="wrongitem"><span class="tag red">Lỗi ${i+1}</span><p><b>${esc(w.text)}</b></p><small class="muted">${esc(w.when)}</small><div style="margin-top:8px"><button class="btn secondary" onclick="wrongExplain(${i})">Xem lại quy tắc</button></div></div>`).join(''):'<div class="card">Chưa có câu sai.</div>';$('#v-wrong').innerHTML=`<div class="pagehead"><div><h2>Sổ câu sai</h2><p>Câu sai được lưu tự động trên thiết bị để luyện lại đúng lỗ hổng.</p></div><button class="btn danger" onclick="if(confirm('Xóa sổ câu sai?')){st.wrong=[];save();renderWrong();updateTop()}">Xóa sổ</button></div>${items}`}
function findQ(id){return BANK.find(x=>x.id===id)||SOURCE.map(sourceToQ).find(x=>x.id===id)}
function wrongExplain(i){let w=st.wrong[i],q=findQ(w.qid),m=modules.find(x=>x.id===(q?.module||w.module));openModal(`<span class="tag red">Chữa lỗi</span><h3>${esc(w.text)}</h3><div class="formulaHero"><h3>Công thức cần quay lại</h3><div class="formulaBig">${esc(q?.rule||m?.formula||'')}</div></div><div class="formulaGrid"><div class="fbox"><h4>🧠 Bản chất</h4><p>${esc(q?.expl||m?.memory||'')}</p></div><div class="fbox"><h4>⚠️ Bẫy</h4><p>${esc(q?.trap||m?.trap||'')}</p></div><div class="fbox"><h4>↩ Tự kiểm</h4><p>${esc(reverseThinking(q||{module:w.module}).chain)}</p></div></div>`)}
function renderReport(){let a=st.attempted?Math.round(st.correct/st.attempted*100):0;$('#v-report').innerHTML=`<div class="pagehead"><div><h2>Báo cáo tiến độ</h2><p>Theo dõi độ chính xác và mastery theo từng dạng của chuyên đề.</p></div></div><div class="grid g4"><div class="card stat"><strong>${st.attempted}</strong><span>lượt trả lời</span></div><div class="card stat"><strong>${st.correct}</strong><span>câu đúng</span></div><div class="card stat"><strong>${a}%</strong><span>độ chính xác</span></div><div class="card stat"><strong>${st.wrong.length}</strong><span>câu trong sổ sai</span></div></div><div class="card" style="margin-top:15px"><h3>Mastery theo dạng</h3>${modules.map(m=>`<div style="display:grid;grid-template-columns:minmax(190px,320px) 1fr 48px;gap:10px;align-items:center;margin:12px 0"><span>${m.icon} ${m.title}</span><div class="progress"><span style="width:${Math.min(100,st.done[m.id]||0)}%"></span></div><b>${Math.min(100,st.done[m.id]||0)}%</b></div>`).join('')}</div>`}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#v-quiz').classList.contains('active')){e.preventDefault();quiz.checked?nextQ():checkQ()}});
genBank();updateTop();renderHome();
console.assert(BANK.length===600,'BANK must contain 600 questions');
for(const m of modules){console.assert(BANK.filter(q=>q.module===m.id&&q.level==='Cơ bản').length===50);console.assert(BANK.filter(q=>q.module===m.id&&q.level==='Nâng cao').length===50)}
console.assert(SOURCE.length===80,'SOURCE must contain 80 questions');
</script>
</body></html>
